<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100" height="100">
  <defs>
    <!-- Premium Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C07B" />
      <stop offset="50%" stop-color="#C5A880" />
      <stop offset="100%" stop-color="#9B7E56" />
    </linearGradient>
    <!-- Forest Green Background Gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E472C" />
      <stop offset="100%" stop-color="#062214" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="60" cy="60" r="56" fill="url(#greenGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />

  <!-- Shield Shape -->
  <path d="M 60 25 C 78 25 88 32 88 52 C 88 78 60 95 60 95 C 60 95 32 78 32 52 C 32 32 42 25 60 25 Z" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="3" 
        stroke-linejoin="round" />

  <!-- Stylized IE Logo Mark -->
  <!-- Letter I -->
  <line x1="48" y1="42" x2="48" y2="78" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" />
  
  <!-- Letter E -->
  <path d="M 58 42 H 74 M 58 58 H 70 M 58 74 H 74 M 58 42 V 74" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Rising Arrow (pointing up-right representing growth/ROI) -->
  <path d="M 45 78 L 78 40" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="4" 
        stroke-linecap="round" />
  
  <path d="M 66 38 H 80 V 52" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>
